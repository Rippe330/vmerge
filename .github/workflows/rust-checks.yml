name: Rust checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows is the platform this tool actually runs on. Every interesting path -
  # hiding the temp folder, clearing the Zone.Identifier stream, CREATE_NO_WINDOW,
  # the Explorer reveal, .exe discovery - is #[cfg(windows)] and compiles out
  # anywhere else, so a green Linux-only run would say very little.
  test:
    name: Test and Clippy (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # macOS is a platform this tool runs on rather than one it merely compiles
  # for, so it gets what Windows gets. The runners are Apple Silicon, which is
  # the build that ships, and the arm64-only paths - the ad-hoc signature a
  # downloaded ffmpeg needs before it will execute at all, quarantine removal,
  # the Mach-O header the updater checks - exist nowhere else.
  test-macos:
    name: Test and Clippy (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # The one thing unit tests cannot cover: whether a real first run on a real
  # Mac ends with an ffmpeg that actually executes. Every way this can fail -
  # a moved download URL, a rebuilt binary behind a pinned hash, quarantine, a
  # missing signature - shows up here and nowhere else.
  setup-macos:
    name: Downloaded tools run (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Install ffmpeg from a clean state, then run it
        run: |
          set -euo pipefail

          # An ffmpeg already on PATH would be found and reported as success
          # setup never earned, so it is hidden for the length of this step.
          mkdir -p "$RUNNER_TEMP/nothing" "$RUNNER_TEMP/clips"
          rm -rf target/release/ffmpeg "$HOME/Library/Application Support/video-merge"

          # Tools are resolved before any of the job branches, so this installs
          # ffmpeg and then exits complaining there is nothing to merge. The
          # complaint is expected; what matters is what it left on disk.
          PATH="$RUNNER_TEMP/nothing:/usr/bin:/bin:/usr/sbin:/sbin" \
            ./target/release/vmerge --no-tui --no-update --folder "$RUNNER_TEMP/clips" || true

          bin=target/release/ffmpeg/bin
          for tool in ffmpeg ffprobe; do
            test -x "$bin/$tool" || { echo "::error::$tool was not installed"; exit 1; }
          done

          # The real assertion. An unsigned or quarantined arm64 binary is
          # killed by the kernel before main, so this line failing is exactly
          # the Gatekeeper problem it is here to catch.
          "$bin/ffmpeg" -version | head -1
          "$bin/ffprobe" -version | head -1

      # yt-dlp is the other binary this downloads and then runs, and it is the
      # more delicate of the two: yt-dlp_macos is a PyInstaller one-file build,
      # which carries an archive appended after the Mach-O image. `codesign
      # --force` across one of those is the step most likely to produce a
      # binary that installs perfectly and then will not start.
      - name: Install yt-dlp from a clean state, then run it
        run: |
          set -euo pipefail

          rm -rf target/release/yt-dlp "$HOME/Library/Application Support/video-merge/yt-dlp"

          # Both tools are resolved before the download is attempted, so a link
          # that cannot possibly work still installs yt-dlp on the way past.
          # That keeps this off YouTube entirely - no rate limits, no terms to
          # worry about, and nothing that breaks when a site changes.
          PATH="$RUNNER_TEMP/nothing:/usr/bin:/bin:/usr/sbin:/sbin" \
            ./target/release/vmerge --no-update \
              --download "https://example.com/definitely-not-a-video" || true

          tool=target/release/yt-dlp/yt-dlp
          test -x "$tool" || { echo "::error::yt-dlp was not installed"; exit 1; }

          # Where a corrupted appended archive, a missing executable bit, or a
          # quarantine mark all show themselves.
          "$tool" --version

  # Not a test run: this only proves the fallbacks for platforms without a build
  # of their own still compile, so that reaching for a Windows or macOS API
  # without a #[cfg] guard fails here rather than in someone's editor.
  portability:
    name: Compiles on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

# Miri is deliberately absent. Every unsafe block in the crate is in src/proc.rs
# and all but one are #[cfg(windows)] - SetFileAttributesW, the job object that
# stops a child taking its own children with it, and the ctrl-c handler; the
# remaining one is the macOS removexattr call. So on a Linux runner Miri would
# have nothing to check; it cannot evaluate FFI
# calls in any case. It would also fail as written: the ffmpeg and merge tests
# write real files, and Miri blocks filesystem access unless it is run with
# -Zmiri-disable-isolation. If it is ever worth adding, it needs both that flag
# and a reason to exist.
